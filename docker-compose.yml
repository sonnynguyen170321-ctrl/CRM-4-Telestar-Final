x-app-base: &app-base
  image: ghcr.io/brandng/clone-crm-4-u-migration:${IMAGE_TAG:-latest}
  env_file:
    - ${APP_ENV_FILE:-.env.docker}
  environment:
    NODE_ENV: "production"
    PORT: "3000"
    DATABASE_URL: "postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telestar_crm}"
    DIRECT_URL: "postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telestar_crm}"
    REDIS_URL: "redis://redis:6379"
    NEXTAUTH_URL: "${NEXTAUTH_URL}"
    AUTH_SECRET: "${AUTH_SECRET}"
    ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    CRON_SECRET: "${CRON_SECRET}"
    SEQUENCE_AUTOSEND_ENABLED: "${SEQUENCE_AUTOSEND_ENABLED:-false}"
    EMAIL_SEND_DRY_RUN: "${EMAIL_SEND_DRY_RUN:-true}"
  restart: unless-stopped
  networks:
    - crm_internal

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-crm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-telestar_crm}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

  web:
    <<: *app-base
    depends_on:
      redis:
        condition: service_healthy
    command: ["npm", "run", "start"]

  worker:
    <<: *app-base
    depends_on:
      redis:
        condition: service_healthy
    command: ["npm", "run", "worker:start"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crm_internal

networks:
  crm_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
