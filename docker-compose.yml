# `web` and `worker` both inherit this anchor, so they cannot be pinned to different
# images by accident — there is one image reference in this file and both use it.
#
# CRM_IMAGE has no default, deliberately. `${VAR:?message}` makes compose refuse to start
# rather than silently resolving to `:latest`, which is a mutable tag: two `up -d` runs a
# week apart could start different code with no record of the change. Set it to a digest
# (…@sha256:…) or a full-SHA tag. `scripts/deploy.sh` resolves the digest for you.
x-app-base: &app-base
  image: ${CRM_IMAGE:?CRM_IMAGE is required and must be an exact image reference — a digest (ghcr.io/...@sha256:...) or a full-git-sha tag. Never :latest. Run scripts/deploy.sh, or see docs/DEPLOY.md.}
  env_file:
    - ${APP_ENV_FILE:-.env.docker}
  environment:
    NODE_ENV: "production"
    PORT: "3000"
    DATABASE_URL: "postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-telestar_crm}"
    DIRECT_URL: "postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-telestar_crm}"
    # Defaults to the compose-local Redis, but overridable so a managed instance can be
    # used without editing this file. A managed provider gives you rediss://…; the extra
    # "s" is TLS and omitting it fails with an opaque protocol error.
    REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    NEXTAUTH_URL: "${NEXTAUTH_URL:-}"
    AUTH_SECRET: "${AUTH_SECRET:-}"
    ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
    CRON_SECRET: "${CRON_SECRET:-}"
    SEQUENCE_AUTOSEND_ENABLED: "${SEQUENCE_AUTOSEND_ENABLED:-false}"
    EMAIL_SEND_DRY_RUN: "${EMAIL_SEND_DRY_RUN:-true}"
    # OPENAI_API_KEY / GEMINI_API_KEY / GROQ_API_KEY are deliberately NOT listed here.
    #
    # They arrive through `env_file` above, which both `web` and `worker` inherit from this
    # anchor. Adding them with a `${VAR:-}` default would be actively harmful: an unset shell
    # variable would resolve to an empty string, and an `environment:` entry *overrides*
    # `env_file`, so the keys sitting correctly in .env.production would be replaced with
    # blanks — and Telestar AI would report every provider as unconfigured while the file that
    # holds the keys looked fine. Verify injection with `scripts/verify-container-secrets.sh`.
  restart: unless-stopped
  networks:
    - crm_internal

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-crm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-telestar_crm}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

  web:
    <<: *app-base
    depends_on:
      redis:
        condition: service_healthy
    command: ["npm", "run", "start"]
    # `restart: unless-stopped` only fires when the process *exits*, and this one need not.
    # `unhandledRejection` is logged and swallowed (`workers/index.ts`), so a container serving 503s
    # to all 44 users stays `Up` and Docker calls it healthy by absence of evidence. postgres and
    # redis have had a probe all along; the two services carrying the product did not.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      # Next has to boot before a failing probe means anything.
      start_period: 60s

  worker:
    <<: *app-base
    depends_on:
      redis:
        condition: service_healthy
    command: ["npm", "run", "worker:start"]
    # The worker serves no HTTP, so the probe asks the thing that actually decides whether it can do
    # any work: can this process still reach Redis. `lib/bullmq/connection.ts` sets `retryStrategy`
    # to never give up — right for a blip, and the reason a permanently detached worker sits `Up`
    # forever consuming nothing while every page still returns 200. `ioredis` is already a direct
    # dependency, so this needs nothing added to the image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const R=require('ioredis');const c=new R(process.env.REDIS_URL,{lazyConnect:true,maxRetriesPerRequest:1,retryStrategy:()=>null});c.on('error',()=>{});c.connect().then(()=>c.ping()).then(()=>{c.disconnect();process.exit(0)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crm_internal

networks:
  crm_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
