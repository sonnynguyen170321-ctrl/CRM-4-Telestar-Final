# Publish the release image.
#
# This workflow does not validate anything — CI does. It runs only after CI has succeeded
# on `main`, so a commit that fails type-checking, tests, Playwright or the migration
# replay never produces a published image. Validation-only Docker builds happen in the
# `docker` job of ci.yml, including on pull requests.
#
# `workflow_run` runs against the default branch's copy of this file with a read/write
# token, so it must not check out or execute pull-request code. It checks out the exact
# commit CI validated, by SHA.

name: Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed to read the triggering run's individual job results. See the gate step below.
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sonnynguyen170321-ctrl/crm-4-telestar-final

jobs:
  publish:
    name: Build and push
    # `workflow_run` fires on completion regardless of outcome. A cancelled run validated
    # nothing, so it is excluded here; every other outcome is decided by the gate step below
    # rather than by the workflow's overall conclusion.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── The release gate ────────────────────────────────────────────────
      #
      # Deliberately the `CI required checks` job's own conclusion, not the CI workflow's.
      #
      # The workflow conclusion is the *aggregate of every job in it*, including the two that
      # depend on GitHub plan features — CodeQL needs Advanced Security on a private repo, and
      # Dependency Review needs the dependency graph. Where those are unavailable they fail
      # permanently, the workflow conclusion is permanently `failure`, and gating on it means
      # no commit can ever be released no matter how green the code is. The pressure that
      # creates is to delete the security jobs, which is the wrong repair.
      #
      # `CI required checks` already encodes which results are acceptable for which job. Asking
      # it directly keeps release eligibility a statement about the code, while leaving the
      # optional scanners free to be honestly red.
      - name: Require the mandatory CI aggregate to have succeeded
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.name == "CI required checks") | .conclusion' | head -n 1)"

          if [ -z "${conclusion}" ]; then
            echo "::error::No 'CI required checks' job in run ${RUN_ID}. Refusing to publish an image for a run whose mandatory gate cannot be found."
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::'CI required checks' concluded '${conclusion}'. No image is published."
            exit 1
          fi
          echo "Mandatory CI aggregate succeeded — release eligible."
        shell: bash

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit CI actually validated — not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Tags are needed to resolve a release version with `git describe`.
          fetch-depth: 0

      - name: Resolve the validated commit
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "BUILD_SHA=${SHA}" >> "$GITHUB_ENV"
          echo "BUILD_SHA_SHORT=${SHA::7}" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          # A release tag when this commit carries one, otherwise the commit itself.
          # An annotated release tag is never overwritten; `latest` is not a version.
          VERSION="$(git describe --tags --exact-match "$SHA" 2>/dev/null || echo "$SHA")"
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
        shell: bash

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -o pipefail
          docker buildx build \
            --progress=plain \
            --file ./Dockerfile \
            --build-arg "APP_COMMIT=${BUILD_SHA}" \
            --build-arg "APP_VERSION=${BUILD_VERSION}" \
            --build-arg "APP_BUILT_AT=${BUILT_AT}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            --tag "${REGISTRY}/${IMAGE_NAME}:sha-${BUILD_SHA_SHORT}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${BUILD_SHA}" \
            --label "org.opencontainers.image.created=${BUILT_AT}" \
            --label "org.opencontainers.image.revision=${BUILD_SHA}" \
            --label "org.opencontainers.image.version=${BUILD_VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.title=${GITHUB_REPOSITORY#*/}" \
            --metadata-file metadata.json \
            --push \
            . 2>&1 | tee docker-build.log
        shell: bash

      # Task 5 deploys by digest. Recording it here is what makes that possible without
      # trusting a mutable tag.
      - name: Record the published digest
        run: |
          DIGEST=$(node -e "console.log(require('./metadata.json')['containerimage.digest'])")
          echo "Published ${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          {
            echo "## Published image"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${BUILD_SHA}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| immutable tag | \`${REGISTRY}/${IMAGE_NAME}:${BUILD_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Summarize Docker build failure
        if: failure()
        run: |
          {
            echo "## Docker build log tail"
            echo
            echo '```text'
            if [ -f docker-build.log ]; then
              tail -n 160 docker-build.log
            else
              echo "docker-build.log was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
