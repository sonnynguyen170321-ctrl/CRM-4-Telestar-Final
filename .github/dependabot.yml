version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # ESLint 10 removed `context.getFilename()`. eslint-plugin-react still calls it
      # (`util/version.js` -> `resolveBasedir`), and 7.37.5 — the newest published as of
      # 2026-08-08 — declares `eslint: ^3 || ... || ^9.7`, so there is no version of the
      # plugin that supports ESLint 10 at all. We do not depend on it directly; it arrives
      # through eslint-config-next, whose own peer range (`>=9.0.0`) does not catch this.
      #
      # Every ESLint 10 bump therefore fails the Lint job before reporting a single
      # finding:
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      #
      # Remove this ignore once eslint-plugin-react publishes ESLint 10 support. Minor and
      # patch updates to ESLint 9 still come through.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

    groups:
      # Prisma ships the CLI and the client as separate packages that must be the same
      # version. Ungrouped, dependabot raised #58 bumping `@prisma/client` to 7.9.1 while
      # leaving `prisma` at ^6.2.1, which cannot work: five jobs failed in about 56 seconds
      # each — install, generate, migration validation, docker build — because the client and
      # the CLI disagreed. The pull request was not a failed upgrade so much as an upgrade
      # that was never whole.
      #
      # Grouping them means the next Prisma bump arrives as one coherent change that CI can
      # actually judge. It does not make a major upgrade safe — Prisma 7 still needs its own
      # qualification against the tenant extension in lib/prisma.ts, the raw-SQL helpers and
      # the migration suite — but it makes the question answerable.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
