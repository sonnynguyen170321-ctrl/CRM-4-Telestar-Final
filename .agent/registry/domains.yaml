# Domain ownership map.
#
# The keystone of the control plane: `agent brief` and `agent impact` resolve changed paths to
# domains through this file, and everything downstream — risk, skills, tests, verification
# requirement — follows from the domain.
#
# Explicit ownership beats an inferred dependency graph. A graph derived from imports is
# fragile and confidently wrong at the edges; this is checkable by reading it.
#
# `paths` are matched most-specific-first, so a file may match several entries and the
# narrowest wins. Anything matching nothing is `unclassified` and treated as R2 until mapped.

version: 1

domains:
  - id: telestar-ai
    description: Provider gateway, model registry, pricing, agent tools, chat runtime.
    risk: R3
    paths:
      - lib/ai/**
      - lib/agent/**
      - lib/research/**
      - lib/workorders/**
      - app/api/ai/**
      - components/AiAssistant.tsx
      - scripts/ai-*.ts
      - scripts/check-stale-models.mjs
      - scripts/diagnose-ai-agent.ts
      - scripts/verify-ai-attribution.ts
      - scripts/verify-ai-*.ts
      - scripts/verify-new-ai-*.ts
    tests:
      - tests/ai-*.test.ts
      - tests/agent-*.test.ts
      - tests/telestar-ai-*.test.ts
      - tests/work-order-*.test.ts
    e2e:
      - e2e/journeys/telestar-ai-chat.spec.ts
    gates:
      - npm run check:stale-models
    notes: >-
      Live provider gates (ai:smoke-providers, ai:smoke-gateway) require all three
      credentials and are BLOCKED_EXTERNAL without them. Their absence is never a pass.

  - id: auth-rbac-tenancy
    description: Sessions, the six roles, pod scoping, tenant isolation, admin control centre.
    risk: R4
    paths:
      - lib/auth.ts
      - lib/auth/**
      - lib/authRoles.ts
      - lib/podScoping.ts
      - lib/admin/**
      - lib/tenant*.ts
      - app/api/auth/**
      - app/api/admin/**
      - app/api/users/**
      - scripts/create-user.ts
      - scripts/create-admin.ts
      - scripts/restore-internal-users.ts
      - scripts/liveCredentials.ts
    tests:
      - tests/access-control.test.ts
      - tests/admin-*.test.ts
      - tests/podScoping.test.ts
      - tests/tenant-*.test.ts
      - tests/rls*.test.ts
      - tests/session-revocation.test.ts
      - tests/mass-assignment.test.ts
      - tests/object-auth-red-team.test.ts
      - tests/floor-manager-administration.test.ts
    e2e:
      - e2e/roles/**
      - e2e/admin/**
      - e2e/auth/**
    verification: independent
    notes: Cross-tenant leakage is the highest-severity defect class here.

  - id: data-prisma
    description: Schema, migrations, RLS policy, seeds, relational integrity.
    risk: R3
    paths:
      - prisma/**
      - lib/prisma.ts
      - lib/seed-guard.ts
      - supabase/**
      - lib/db/**
      - scripts/verify-rls.mjs
      - scripts/verify-rls-app-paths.mjs
      - scripts/verify-rls-app-paths.probe.ts
      - scripts/verify-rls-enablement.mjs
      - scripts/verify-rls-live.mjs
      # The tenant boundaries RLS cannot hold: foreign keys with no tenant component, and
      # tables with no tenantId for rls.sql to find. Reported from the datamodel and from the
      # data respectively.
      - scripts/audit-tenant-integrity.mjs
      - scripts/audit-cross-tenant-rows.mjs
      # The composite-key migration toolchain.
      - scripts/apply-composite-tenant-keys.mjs
      - scripts/patch-composite-setnull.mjs
      - scripts/preserve-referential-actions.mjs
      - scripts/verify-db-integrity.ts
      - scripts/check-relational-integrity.ts
      - scripts/harden-db-roles.sql
      - scripts/apply-p8-migration.mjs
      - scripts/demo-seed.ts
      - prisma/seed-demo.ts
      - scripts/backfill-*
      - scripts/purge-*
      - scripts/repair-*
      - scripts/cutover/**
    tests:
      - tests/migration-*.test.ts
      - tests/rls-policy-coverage.test.ts
      - tests/seed-guard.test.ts
      - tests/db-role-least-privilege.test.ts
      - tests/*reference-integrity.test.ts
    gates:
      - npm run check:migration-order
      - npm run check:relational-integrity
      - npm run verify:rls
    verification: independent
    notes: >-
      A migration can sort correctly and still be wrong. `migrate diff` from an empty shadow
      database is the correctness authority; check:migration-order is only a speed gate.

  - id: workers-durability
    description: BullMQ workers, queues, job leases, retries, idempotency, cron.
    risk: R3
    paths:
      - workers/**
      - lib/bullmq/**
      - scripts/worker-*.ts
      - scripts/worker-*.cjs
      - scripts/diagnose-import.mjs
      - app/api/cron/**
    tests:
      - tests/*-worker.test.ts
      - tests/bullmq.test.ts
      - tests/queue-*.test.ts
      - tests/redis-*.test.ts
      - tests/failure-matrix.test.ts
      - tests/import-*.test.ts
    verification: independent
    notes: >-
      Redis-dependent suites are BLOCKED_EXTERNAL without a live Redis. On CI the service
      container exists, so a skip there means the container is broken, not that the test is
      optional.

  - id: email-automation
    description: Sequence engine, scheduling, enrolment, send pipeline, suppression.
    risk: R3
    paths:
      - lib/sequences/**
      - lib/automation/**
      - lib/email/**
      - lib/emailSafety.ts
      - lib/replies/**
      - app/api/sequences/**
      - scripts/sync-sequence-enrollments.ts
    tests:
      - tests/sequence-*.test.ts
      - tests/scheduling.test.ts
      - tests/eligibility.test.ts
      - tests/defer-scheduling.test.ts
      - tests/weekend-policy.test.ts
      - tests/businessDays.test.ts
      - tests/email-idempotency.test.ts
      - tests/email-safety.test.ts
      - tests/unsubscribe.test.ts
      - tests/demo-email-barrier.test.ts
      - tests/variant-attribution.test.ts
    e2e:
      - e2e/journeys/automation*.spec.ts
    verification: independent
    notes: >-
      Only lib/automation/scheduling.ts computes a schedule. Jitter and A/B selection are
      seeded from durable ids, never Math.random().

  - id: email-deliverability
    description: Domain and mailbox health, bounce handling, warmup, sending reputation.
    risk: R3
    paths:
      - lib/email-health/**
      - app/api/email-health/**
      - scripts/diagnose-email-*.ts
      - scripts/test-email-*.ts
    tests:
      - tests/email-health-*.test.ts
      - tests/bounceDetection.test.ts
      - tests/email-oauth.test.ts
      - tests/webhooks-scoring.test.ts

  - id: leadgen-intelligence
    description: Sourcing, qualification, ICP adherence, lead pool, handoff to SDR.
    risk: R2
    paths:
      - lib/leadgen/**
      - lib/contact-intelligence/**
      - lib/search/**
      - app/api/leadgen/**
      - app/leadgen/**
      - app/leadgen-manager/**
    tests:
      - tests/leadgen*.test.ts
      - tests/icp-adherence.test.ts
      - tests/opportunity-handoff.test.ts
      - tests/contact-intelligence.test.ts

  - id: revenue-intelligence
    description: Opportunities, meetings, commercial signals, learning, client reporting.
    risk: R2
    paths:
      - lib/meetings/**
      - lib/opportunities/**
      - lib/reporting/**
      - lib/client-reports/**
      - app/api/client-reports/**
      - app/api/opportunities/**
      - app/api/meetings/**
    tests:
      - tests/revenue-*.test.ts
      - tests/commercial-*.test.ts
      - tests/opportunities.test.ts
      - tests/meetings.test.ts
      - tests/client-report*.test.ts
      - tests/relationship-capital.test.ts
    e2e:
      - e2e/reports/**
      - e2e/meetings/**

  - id: api-contracts
    description: Route handlers, request validation, error envelopes, rate limiting.
    risk: R2
    paths:
      - app/api/**
      # Response caching for the route handlers above — every consumer of it is one of them.
      - lib/cache.ts
      - lib/api/**
      - lib/validation*.ts
      - lib/validation/**
      - lib/webhooks/**
    tests:
      - tests/validation.test.ts
      - tests/security-injection.test.ts
      - tests/csp.test.ts
      - tests/login-throttle.test.ts
      - tests/api-keys-and-integrations.test.ts

  - id: product-workflows
    description: Leads, tasks, activities, notes, reminders, stage lifecycle.
    risk: R2
    paths:
      - lib/leads/**
      - lib/tasks/**
      - lib/briefing/**
      - app/api/leads/**
      - app/api/tasks/**
      - app/api/activities/**
    tests:
      - tests/lead-*.test.ts
      - tests/activities.test.ts
      - tests/lifecycle-integration.test.ts
      - tests/prospect-operating-state.test.ts
    e2e:
      - e2e/leads/**

  - id: frontend-role-ux
    description: Components, pages, role-scoped surfaces, design system.
    risk: R1
    paths:
      - app/**/page.tsx
      - app/**/layout.tsx
      - components/**
      - hooks/**
      - context/**
      - app/globals.css
      - app/fonts.ts
    tests:
      - tests/typography-design-system.test.ts
      - tests/phase-9-role-surfaces.test.ts
      - tests/telestar-ai-ui-routes.test.ts
    e2e:
      - e2e/crm-journeys.spec.ts
      - e2e/roles/desktop-gate.spec.ts

  - id: testing-certification
    description: Test harness, fixtures, certification evidence and its validators.
    risk: R3
    paths:
      - tests/**
      - e2e/**
      - scripts/certification/**
      - scripts/live-e2e-*
      - scripts/verify-rbac-*
      - scripts/e2e-*
      - scripts/verify-*-live.ts
      - scripts/deep-*-audit.ts
      - scripts/deep-audit-*.ts
      - scripts/check-test-discipline.mjs
      - scripts/check-seed-delete-order.mjs
      - playwright.config.ts
      - vitest.config.ts
    tests:
      - tests/certification-*.test.ts
      - tests/release.test.ts
      - tests/render.test.ts
    gates:
      - npm run check:test-discipline
      - npm run check:seed-delete-order
    notes: Certification verdicts are generated from evidence. Never hand-edit generated output.

  - id: production-release
    description: Compose topology, deployment, environment contract, release identity, CI.
    risk: R4
    paths:
      - docker-compose*.yml
      - Dockerfile*
      - .github/workflows/**
      # Which dependency versions this repository will accept. It belongs with CI rather
      # than with security-observability because what it actually governs is whether a
      # bump can pass the gates in `.github/workflows/` at all — the Prisma group exists
      # because the CLI and the client must move together or install fails, and the
      # TypeScript ignore exists because @typescript-eslint pins the compiler below 7.
      - .github/dependabot.yml
      - scripts/deploy*
      - scripts/rollback*
      - scripts/prod-*
      - scripts/cutover-preflight.ts
      - scripts/verify-container-secrets.sh
      - scripts/post-deploy-*.sh
      - scripts/canary-*
      - scripts/build.cjs
      # Asserts the GCP compose topology invariants — Cloud SQL wiring, local Postgres
      # disabled, no port exposure. It validates this domain's own artifacts, so it belongs
      # here rather than with the database domain its DSN fixture happens to mention.
      - scripts/check-production-compose.mjs
      # Drives a real browser against a deployed environment and submits real login attempts.
      # It defaulted to the production IP until 2026-08-24 and now fails closed on BASE_URL;
      # either way, what it can reach is production, which is what sets its risk class.
      - scripts/live-role-audit.ts
      # Doctor decides whether this machine may run anything at all, and validates the same
      # environment contract this domain owns (lib/env-contract.ts, .env.production.example).
      # Its tests were already classified here; the scripts themselves were not.
      - scripts/doctor*
      - next.config.ts
      - lib/env.ts
      - lib/env-contract.ts
      - .env.production.example
      - package.json
      - package-lock.json
      - .gitignore
      - .gitattributes
    tests:
      - tests/prod-env.test.ts
      - tests/cutover-preflight.test.ts
      - tests/doctor.test.ts
      - tests/doctor-machine-truth.test.ts
    gates:
      - npm run check:production-compose
    verification: independent
    authorization: operator
    notes: Mutating production requires explicit operator authorization for that action.

  - id: security-observability
    description: Secrets handling, injection defence, audit trail, logging hygiene.
    risk: R4
    paths:
      - lib/crypto.ts
      - lib/audit.ts
      - lib/security/**
      - scripts/encrypt-existing-tokens.ts
      - .gitleaks.toml
    tests:
      - tests/security-injection.test.ts
      - tests/gitleaks-allowlist.test.ts
      - tests/admin-audit.test.ts
    verification: independent

  - id: agent-control-plane
    description: This control plane, the adapters generated from it, and the agent CLI.
    risk: R2
    paths:
      - .agent/registry/**
      - .agent/generated/**
      - .agent/evals/**
      - .agent/memory/**
      - .agent/agents/**
      - .agent/skills/**
      - .agent/CONSTITUTION.md
      - AGENTS.md
      - CLAUDE.md
      - .claude/**
      - scripts/agent/**
    tests:
      - tests/agent-facts.test.ts
    gates:
      - npm run agent -- context-audit
      - npm run agent -- facts --check
    notes: >-
      Changing the kernel or the registry changes every future session and every routing
      decision. Treat a context-budget regression as a defect, not a cost of doing business.
      Note that `docs/agent-os/**` is deliberately NOT here — writing down what was done is
      documentation (R0); changing how routing works is not.

  - id: artifacts
    description: Build and test output. Not source; owns no behaviour.
    risk: R0
    paths:
      - screenshots/**
    notes: >-
      Mapped so routing coverage measures what it should. A change here never implies a
      behaviour change; if one seems to, the behaviour changed somewhere else.
      Only directories that actually exist are listed — `agent check` rejects a speculative
      mapping, and a path that appears later will surface as a routing gap in `agent roi`.
      `test-results/**` was listed here and is gone: Playwright writes it and .gitignore
      excludes it, so it exists on a machine that has run the browser suite and never on a
      clean checkout. That made registry-integrity pass locally and fail on every CI run —
      a mapping whose validity depended on whose machine ran the check. A gitignored output
      directory cannot appear in a diff, so mapping it bought no routing coverage anyway.

  - id: documentation
    description: Prose. Explains meaning; states no derived fact.
    risk: R0
    paths:
      - docs/**
      - README.md
      - SKILL.md
      - .agent/README.md
      - .agent/**/README.md
    notes: >-
      R0 only because prose cannot break a running system. It can still be wrong, and a
      confidently wrong document outlives the person who wrote it — which is why facts are
      generated rather than written here.
