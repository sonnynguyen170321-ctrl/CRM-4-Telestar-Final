services:
  postgres:
    profiles:
      - local-postgres-disabled-on-aws

  web:
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DIRECT_URL: "${DIRECT_URL}"
      BACKUP_DATABASE_URL: "${BACKUP_DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      CRON_SECRET: "${CRON_SECRET}"
      EMAIL_SEND_DRY_RUN: "${EMAIL_SEND_DRY_RUN:-true}"
      SEQUENCE_AUTOSEND_ENABLED: "${SEQUENCE_AUTOSEND_ENABLED:-false}"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DIRECT_URL: "${DIRECT_URL}"
      BACKUP_DATABASE_URL: "${BACKUP_DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      CRON_SECRET: "${CRON_SECRET}"
      EMAIL_SEND_DRY_RUN: "${EMAIL_SEND_DRY_RUN:-true}"
      SEQUENCE_AUTOSEND_ENABLED: "${SEQUENCE_AUTOSEND_ENABLED:-false}"
      IS_WORKER: "true"
    depends_on:
      redis:
        condition: service_healthy
